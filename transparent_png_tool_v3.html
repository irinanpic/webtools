<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>透過画像ジェネレーター (PNG / WebP)</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Shared Memory Transfer Module -->
  <script src="memory_transfer.js"></script>

  <style>
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 5px;
      border: 2px solid #0f172a;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* 透過プレビュー背景パターン */
    .bg-checker {
      background-color: #1e293b;
      background-image: 
        linear-gradient(45deg, #0f172a 25%, transparent 25%), 
        linear-gradient(-45deg, #0f172a 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #0f172a 75%), 
        linear-gradient(-45deg, transparent 75%, #0f172a 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .bg-red { background-color: #dc2626 !important; background-image: none !important; }
    .bg-green { background-color: #16a34a !important; background-image: none !important; }
    .bg-blue { background-color: #2563eb !important; background-image: none !important; }
    .bg-black { background-color: #000000 !important; background-image: none !important; }
    .bg-white { background-color: #ffffff !important; background-image: none !important; }

    /* カラー入力のカスタムスタイル */
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased select-none bg-slate-900 text-slate-100">

  <!-- Header -->
  <header class="bg-slate-800/90 border-b border-slate-700/80 px-4 py-3 flex items-center justify-between shrink-0 shadow-md backdrop-blur z-20">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
        <i class="fa-solid font-bold fa-eraser text-lg"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white leading-none">透過画像ジェネレーター</h1>
        <p class="text-xs text-slate-400 mt-1">カラー透過・境界アルファブレンド・手動マスク＆バケツ補正</p>
      </div>
    </div>

    <!-- Undo / Redo & Action Buttons -->
    <div class="flex items-center space-x-2">
      <!-- Undo / Redo -->
      <div class="flex items-center bg-slate-900/60 p-1 rounded-lg border border-slate-700/60 mr-2">
        <button id="undoBtn" title="元に戻す (Ctrl+Z)" class="px-2.5 py-1.5 text-slate-400 hover:text-white disabled:opacity-30 disabled:hover:text-slate-400 text-xs font-medium rounded transition flex items-center space-x-1" disabled>
          <i class="fa-solid fa-rotate-left"></i>
          <span>元に戻す</span>
        </button>
        <div class="h-4 w-px bg-slate-700 mx-1"></div>
        <button id="redoBtn" title="やり直す (Ctrl+Y)" class="px-2.5 py-1.5 text-slate-400 hover:text-white disabled:opacity-30 disabled:hover:text-slate-400 text-xs font-medium rounded transition flex items-center space-x-1" disabled>
          <i class="fa-solid fa-rotate-right"></i>
          <span>やり直す</span>
        </button>
      </div>

      <button id="saveMemoryBtn" class="px-3.5 py-1.5 bg-indigo-700/70 hover:bg-indigo-600 active:bg-indigo-800 text-indigo-100 text-xs font-semibold rounded-lg shadow-sm border border-indigo-500/60 transition flex items-center space-x-1.5" title="透過処理結果をメモリに保存します">
        <i class="fa-solid fa-floppy-disk text-indigo-300"></i>
        <span>メモリに保存</span>
      </button>
      <button id="loadMemoryBtn" class="px-3.5 py-1.5 bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 text-xs font-semibold rounded-lg shadow-sm border border-slate-600 transition flex items-center space-x-1.5" title="メモリから画像を読み出します">
        <i class="fa-solid fa-arrow-up-from-bracket text-slate-300"></i>
        <span>メモリから読み出し</span>
      </button>
      <button id="resetBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg transition border border-slate-600 flex items-center space-x-1.5">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span>初期化</span>
      </button>
      <button id="downloadPngBtn" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow-md shadow-indigo-600/20 transition flex items-center space-x-1.5">
        <i class="fa-solid fa-download"></i>
        <span>PNG保存</span>
      </button>
      <button id="downloadWebpBtn" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow-md shadow-emerald-600/20 transition flex items-center space-x-1.5">
        <i class="fa-solid fa-file-image"></i>
        <span>WebP保存</span>
      </button>
    </div>
  </header>

  <!-- Main Application Body -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- Left Sidebar Controls -->
    <aside class="w-full md:w-80 bg-slate-800/90 border-r border-slate-700/80 p-4 flex flex-col space-y-4 overflow-y-auto shrink-0 z-10">
      
      <!-- 1. 画像選択 -->
      <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 space-y-2">
        <div class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center">
          <i class="fa-solid fa-folder-open mr-1.5 text-indigo-400"></i>
          <span>1. 画像選択</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" class="hidden">
        <button onclick="document.getElementById('fileInput').click()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-200 text-xs font-medium rounded-lg transition border border-slate-600 flex items-center justify-center space-x-2">
          <i class="fa-solid fa-upload"></i>
          <span>別の画像を開く</span>
        </button>
      </div>

      <!-- 2. 透過色の指定 -->
      <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 space-y-3">
        <div class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center">
          <i class="fa-solid fa-palette mr-1.5 text-indigo-400"></i>
          <span>2. 透過色の指定</span>
        </div>
        
        <div class="flex items-center space-x-3 bg-slate-800/80 p-2 rounded-lg border border-slate-700">
          <input type="color" id="targetColor" value="#ffffff" class="w-8 h-8 bg-transparent cursor-pointer rounded border border-slate-600">
          <span id="colorHexText" class="font-mono text-xs text-indigo-400 font-bold">#ffffff</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button id="autoDetectCornersBtn" class="py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg border border-slate-600 transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-expand text-[10px]"></i>
            <span>四隅自動検出</span>
          </button>
          <button id="toolPipette" class="py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg border border-slate-600 transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-eye-dropper text-[10px]"></i>
            <span>スポイト</span>
          </button>
        </div>
      </div>

      <!-- 3. 透過範囲 & 境界アンチエイリアス -->
      <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 space-y-3">
        <div class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center">
          <i class="fa-solid fa-sliders mr-1.5 text-indigo-400"></i>
          <span>3. 透過範囲・エッジ処理</span>
        </div>

        <!-- Mode Select -->
        <div class="space-y-1">
          <label class="text-[11px] text-slate-400 block">透過モード</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="modeFlood" class="py-1.5 px-2 bg-indigo-600 text-white text-xs font-semibold rounded-lg border border-indigo-500 transition">
              外側のみ連結
            </button>
            <button id="modeAll" class="py-1.5 px-2 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition">
              全体同色一括
            </button>
          </div>
        </div>

        <!-- Tolerance -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs">
            <span class="text-slate-300">許容誤差 (Tolerance)</span>
            <span id="tolVal" class="font-mono text-indigo-400 font-bold">30</span>
          </div>
          <input type="range" id="toleranceSlider" min="0" max="150" value="30" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg cursor-pointer">
        </div>

        <!-- Feather -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs">
            <span class="text-slate-300">色差フェザー</span>
            <span id="featherVal" class="font-mono text-indigo-400 font-bold">10</span>
          </div>
          <input type="range" id="featherSlider" min="0" max="40" value="10" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg cursor-pointer">
        </div>

        <!-- Smooth Edge -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs">
            <span class="text-slate-300">境界アルファブレンド</span>
            <span id="smoothVal" class="font-mono text-indigo-400 font-bold">1.5px</span>
          </div>
          <input type="range" id="smoothSlider" min="0" max="5" step="0.5" value="1.5" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg cursor-pointer">
        </div>
      </div>

      <!-- 4. 手動マスク・補正ツール (ブラシ & バケツ) -->
      <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 space-y-3">
        <div class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center justify-between">
          <span><i class="fa-solid fa-paintbrush mr-1.5 text-indigo-400"></i> 4. マスク補正 (ブラシ/バケツ)</span>
        </div>

        <!-- Brush & Bucket Tool Buttons -->
        <div class="grid grid-cols-2 gap-2">
          <button id="toolProtect" title="ドラッグして領域を保護" class="py-2 bg-slate-800 text-slate-300 border border-slate-700 text-xs font-medium rounded-lg transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-shield-halved text-emerald-400"></i>
            <span>🛡️ 保護ブラシ</span>
          </button>
          <button id="toolErase" title="ドラッグして領域を透過" class="py-2 bg-slate-800 text-slate-300 border border-slate-700 text-xs font-medium rounded-lg transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-scissors text-amber-400"></i>
            <span>✂️ 透過ブラシ</span>
          </button>
          <button id="toolBucketProtect" title="クリック位置と同色の連続部分をまとめて保護" class="py-2 bg-slate-800 text-slate-300 border border-slate-700 text-xs font-medium rounded-lg transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-fill-drip text-emerald-400"></i>
            <span>🪣 保護バケツ</span>
          </button>
          <button id="toolBucketErase" title="クリック位置と同色の連続部分をまとめて透過" class="py-2 bg-slate-800 text-slate-300 border border-slate-700 text-xs font-medium rounded-lg transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-fill-drip text-amber-400"></i>
            <span>🪣 透過バケツ</span>
          </button>
        </div>

        <!-- Mask Color Settings -->
        <div class="bg-slate-800/80 p-2.5 rounded-lg border border-slate-700/80 space-y-2 text-xs">
          <div class="flex items-center justify-between">
            <span class="text-slate-400">保護マスク表示色:</span>
            <input type="color" id="protectColorInput" value="#00ffcc" class="w-6 h-6 bg-transparent cursor-pointer rounded border border-slate-600">
          </div>
          <div class="flex items-center justify-between">
            <span class="text-slate-400">透過マスク表示色:</span>
            <input type="color" id="eraseColorInput" value="#ff9900" class="w-6 h-6 bg-transparent cursor-pointer rounded border border-slate-600">
          </div>
        </div>

        <!-- Brush Size -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs">
            <span class="text-slate-300">ブラシサイズ</span>
            <span id="brushSizeVal" class="font-mono text-indigo-400 font-bold">20px</span>
          </div>
          <input type="range" id="brushSizeSlider" min="2" max="150" value="20" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg cursor-pointer">
        </div>

        <!-- Brush Softness -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs">
            <span class="text-slate-300">ブラシぼかし (フェザー)</span>
            <span id="brushHardnessVal" class="font-mono text-indigo-400 font-bold">50%</span>
          </div>
          <input type="range" id="brushHardnessSlider" min="0" max="100" value="50" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg cursor-pointer">
        </div>

        <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer pt-1">
          <input type="checkbox" id="showMaskCheckbox" checked class="w-4 h-4 rounded accent-indigo-600 bg-slate-800 border-slate-700">
          <span>マスクの色を表示する</span>
        </label>

        <button id="clearMaskBtn" class="w-full py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 text-xs font-medium rounded-lg border border-rose-500/30 transition">
          全マスクをクリア
        </button>
      </div>

      <!-- 5. 抜け漏れチェック用背景 -->
      <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 space-y-2">
        <div class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center">
          <i class="fa-solid fa-layer-group mr-1.5 text-indigo-400"></i>
          <span>5. 抜け漏れチェック用背景</span>
        </div>
        <div class="grid grid-cols-3 gap-1.5">
          <button data-bg="bg-checker" class="bg-btn py-1 px-2 text-xs font-semibold rounded bg-indigo-600 text-white border border-indigo-500">市松</button>
          <button data-bg="bg-red" class="bg-btn py-1 px-2 text-xs font-semibold rounded bg-slate-800 text-rose-400 border border-slate-700 hover:bg-slate-700">赤</button>
          <button data-bg="bg-green" class="bg-btn py-1 px-2 text-xs font-semibold rounded bg-slate-800 text-emerald-400 border border-slate-700 hover:bg-slate-700">緑</button>
          <button data-bg="bg-blue" class="bg-btn py-1 px-2 text-xs font-semibold rounded bg-slate-800 text-blue-400 border border-slate-700 hover:bg-slate-700">青</button>
          <button data-bg="bg-black" class="bg-btn py-1 px-2 text-xs font-semibold rounded bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">黒</button>
          <button data-bg="bg-white" class="bg-btn py-1 px-2 text-xs font-semibold rounded bg-slate-800 text-slate-900 font-bold bg-white/90 border border-slate-300 hover:bg-white">白</button>
        </div>
      </div>

      <!-- Image Info Label -->
      <div class="mt-auto bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 text-xs text-slate-400 flex justify-between">
        <span>画像サイズ:</span>
        <span id="imgInfoText" class="font-mono text-slate-200">未読み込み</span>
      </div>

    </aside>

    <!-- Canvas Workspace (Scrollable container on zoom) -->
    <section id="workspace" class="flex-1 relative bg-slate-950 flex overflow-auto p-8 select-none">

      <!-- Drag and Drop Overlay -->
      <div id="dropzone" class="m-auto max-w-md w-full border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer transition-all bg-slate-800/40 hover:bg-slate-800/80 group">
        <div class="w-16 h-16 rounded-full bg-slate-700/50 group-hover:bg-indigo-600/20 text-slate-400 group-hover:text-indigo-400 flex items-center justify-center text-2xl transition-all mb-4">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <h3 class="text-base font-bold text-slate-200 mb-1">ここに画像をドラッグ＆ドロップ</h3>
        <p class="text-xs text-slate-400 mb-4">またはクリックしてファイルを選択</p>
        <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg shadow-lg shadow-indigo-600/20 transition">
          ファイルを選択する
        </button>
      </div>

      <!-- Main Canvas Centered Wrapper in Scrollable Space -->
      <div id="canvasCenterer" class="m-auto flex items-center justify-center hidden">
        <div id="canvasWrapper" class="relative bg-checker shadow-2xl rounded-lg border border-slate-700/50">
          <canvas id="mainCanvas" class="block cursor-crosshair"></canvas>
        </div>
      </div>

      <!-- Floating View Zoom Controls (Top-Right Fixed Overlay) -->
      <div id="zoomControls" class="fixed top-16 right-6 z-30 bg-slate-800/95 border border-slate-700/80 rounded-xl px-3 py-1.5 shadow-2xl backdrop-blur flex items-center space-x-2 hidden">
        <button id="zoomOutBtn" title="縮小 (Ctrl + ホイール下)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 active:bg-slate-800 rounded-lg text-slate-200 text-xs flex items-center justify-center transition">
          <i class="fa-solid fa-minus"></i>
        </button>
        <span id="zoomPercentText" class="text-xs font-mono font-bold text-indigo-400 min-w-[55px] text-center">FIT</span>
        <button id="zoomInBtn" title="拡大 (Ctrl + ホイール上)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 active:bg-slate-800 rounded-lg text-slate-200 text-xs flex items-center justify-center transition">
          <i class="fa-solid fa-plus"></i>
        </button>
        <div class="h-4 w-px bg-slate-700 mx-1"></div>
        <button id="zoomResetBtn" title="100%等倍表示" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-[11px] font-semibold rounded-lg transition">
          100%
        </button>
        <button id="zoomFitBtn" title="画面に合わせる" class="px-2 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-semibold rounded-lg transition">
          フィット
        </button>
      </div>

    </section>

  </main>

  <script>
    // DOM Elements
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const workspace = document.getElementById('workspace');
    const canvasCenterer = document.getElementById('canvasCenterer');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const imgInfoText = document.getElementById('imgInfoText');

    // Controls
    const targetColorInput = document.getElementById('targetColor');
    const colorHexText = document.getElementById('colorHexText');
    const autoDetectCornersBtn = document.getElementById('autoDetectCornersBtn');
    const toleranceSlider = document.getElementById('toleranceSlider');
    const tolVal = document.getElementById('tolVal');
    const featherSlider = document.getElementById('featherSlider');
    const featherVal = document.getElementById('featherVal');
    const smoothSlider = document.getElementById('smoothSlider');
    const smoothVal = document.getElementById('smoothVal');
    const modeFloodBtn = document.getElementById('modeFlood');
    const modeAllBtn = document.getElementById('modeAll');

    // Brush & Bucket Controls
    const toolProtectBtn = document.getElementById('toolProtect');
    const toolEraseBtn = document.getElementById('toolErase');
    const toolBucketProtectBtn = document.getElementById('toolBucketProtect');
    const toolBucketEraseBtn = document.getElementById('toolBucketErase');
    const toolPipetteBtn = document.getElementById('toolPipette');

    const protectColorInput = document.getElementById('protectColorInput');
    const eraseColorInput = document.getElementById('eraseColorInput');
    const brushSizeSlider = document.getElementById('brushSizeSlider');
    const brushSizeVal = document.getElementById('brushSizeVal');
    const brushHardnessSlider = document.getElementById('brushHardnessSlider');
    const brushHardnessVal = document.getElementById('brushHardnessVal');
    const showMaskCheckbox = document.getElementById('showMaskCheckbox');
    const clearMaskBtn = document.getElementById('clearMaskBtn');

    // Zoom Controls
    const zoomControls = document.getElementById('zoomControls');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomFitBtn = document.getElementById('zoomFitBtn');
    const zoomPercentText = document.getElementById('zoomPercentText');

    // History Controls
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');

    const resetBtn = document.getElementById('resetBtn');
    const downloadPngBtn = document.getElementById('downloadPngBtn');
    const downloadWebpBtn = document.getElementById('downloadWebpBtn');

    // State
    let originalImage = null;
    let originalData = null; 
    
    // アルファ手動マスクマップ (Float32Array 0.0〜1.0 の連続値)
    let protectMaskMap = null; 
    let eraseMaskMap = null;

    let currentMode = 'flood'; 
    let currentTool = 'none'; // 'none', 'protect', 'erase', 'bucket-protect', 'bucket-erase', 'pipette'
    let isDrawing = false;
    let lastPos = null;

    // Display Zoom State (0: Auto-Fit, >0: Scale ratio)
    let zoomLevel = 0; 

    // History Stack for Undo/Redo
    const MAX_HISTORY = 30;
    let historyStack = [];
    let historyIndex = -1;

    function saveState() {
      if (!protectMaskMap || !eraseMaskMap) return;

      // 古い未来履歴の削除
      if (historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
      }

      historyStack.push({
        protectMap: new Float32Array(protectMaskMap),
        eraseMap: new Float32Array(eraseMaskMap),
        targetColor: targetColorInput.value,
        tolerance: toleranceSlider.value,
        feather: featherSlider.value,
        smooth: smoothSlider.value,
        mode: currentMode
      });

      if (historyStack.length > MAX_HISTORY) {
        historyStack.shift();
      } else {
        historyIndex++;
      }

      updateHistoryUI();
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        restoreState(historyStack[historyIndex]);
      }
    }

    function redo() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        restoreState(historyStack[historyIndex]);
      }
    }

    function restoreState(state) {
      protectMaskMap.set(state.protectMap);
      eraseMaskMap.set(state.eraseMap);
      targetColorInput.value = state.targetColor;
      colorHexText.textContent = state.targetColor;
      toleranceSlider.value = state.tolerance;
      tolVal.textContent = state.tolerance;
      featherSlider.value = state.feather;
      featherVal.textContent = state.feather;
      smoothSlider.value = state.smooth;
      smoothVal.textContent = state.smooth + 'px';
      
      currentMode = state.mode;
      updateModeUI();
      updateHistoryUI();
      render();
    }

    function updateHistoryUI() {
      undoBtn.disabled = (historyIndex <= 0);
      redoBtn.disabled = (historyIndex >= historyStack.length - 1);
    }

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = (event) => {

          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);
          originalData = ctx.getImageData(0, 0, img.width, img.height);

          dropzone.classList.add('hidden');

    /**
     * 表示倍率コントロール（画像解像度は維持したままスタイルの拡大縮小のみ変更）
     */
    function setZoom(level) {
      if (!originalImage) return;
      zoomLevel = level;

      if (zoomLevel === 0) {
        // FIT モード: ワークスペースの幅/高さに合わせて自動フィット
        const wsW = workspace.clientWidth - 64;
        const wsH = workspace.clientHeight - 64;
        const scale = Math.min(wsW / originalImage.width, wsH / originalImage.height, 1.0);
        
        const displayW = Math.round(originalImage.width * scale);
        const displayH = Math.round(originalImage.height * scale);

        canvas.style.width = displayW + 'px';
        canvas.style.height = displayH + 'px';
        zoomPercentText.textContent = `${Math.round(scale * 100)}%`;
      } else {
        const displayW = Math.round(originalImage.width * zoomLevel);
        const displayH = Math.round(originalImage.height * zoomLevel);

        canvas.style.width = displayW + 'px';
        canvas.style.height = displayH + 'px';
        zoomPercentText.textContent = `${Math.round(zoomLevel * 100)}%`;
      }
    }

    // マウスホイールズーム (スクロール操作でスムース拡大縮小)
    workspace.addEventListener('wheel', (e) => {
      if (!originalImage) return;
      e.preventDefault();

      // ズーム前のマウスカーソル位置（Canvas基準比率）を保持
      const canvasRectBefore = canvas.getBoundingClientRect();
      const mouseCanvasX = e.clientX - canvasRectBefore.left;
      const mouseCanvasY = e.clientY - canvasRectBefore.top;
      const ratioX = mouseCanvasX / canvasRectBefore.width;
      const ratioY = mouseCanvasY / canvasRectBefore.height;

      const currentScale = zoomLevel === 0 ? (parseFloat(canvas.style.width) / originalImage.width) : zoomLevel;
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      let nextScale = currentScale * zoomFactor;

      if (nextScale < 0.1) nextScale = 0.1;
      if (nextScale > 10.0) nextScale = 10.0;

      setZoom(nextScale);

      // ズーム後のカーソル位置ズレをスクロール補正してカーソル直下の場所を保持
      const canvasRectAfter = canvas.getBoundingClientRect();
      const targetX = canvasRectAfter.left + ratioX * canvasRectAfter.width;
      const targetY = canvasRectAfter.top + ratioY * canvasRectAfter.height;

      workspace.scrollLeft += (targetX - e.clientX);
      workspace.scrollTop += (targetY - e.clientY);
    }, { passive: false });

    function autoDetectCorners() {
      if (!originalData) return;
      const w = originalData.width;
      const h = originalData.height;
      const data = originalData.data;

      const corners = [
        0,
        (w - 1) * 4,
        ((h - 1) * w) * 4,
        ((h - 1) * w + (w - 1)) * 4
      ];

      let r = 0, g = 0, b = 0;
      corners.forEach(idx => {
        r += data[idx];
        g += data[idx + 1];
        b += data[idx + 2];
      });
      r = Math.round(r / 4);
      g = Math.round(g / 4);
      b = Math.round(b / 4);

      const hex = rgbToHex(r, g, b);
      targetColorInput.value = hex;
      colorHexText.textContent = hex;
    }

    // Mouse & Touch Handling for Canvas
    canvas.addEventListener('mousedown', (e) => {

    /**
     * 表示サイズ(CSS Scale)に関わらず正確な内部画像座標(px)を取得する
     */
    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: Math.min(canvas.width - 1, Math.max(0, Math.floor((e.clientX - rect.left) * scaleX))),
        y: Math.min(canvas.height - 1, Math.max(0, Math.floor((e.clientY - rect.top) * scaleY)))
      };
    }

    /**
     * 透過/保護バケツツール（クリック地点の色と同色領域を許容誤差考慮でまとめて追加）
     */
    function applyBucket(startX, startY, tool) {
      const w = canvas.width;
      const h = canvas.height;
      const src = originalData.data;

      const startIdx = (startY * w + startX) * 4;
      const startR = src[startIdx];
      const startG = src[startIdx + 1];
      const startB = src[startIdx + 2];

      const tol = parseFloat(toleranceSlider.value);
      const feather = parseFloat(featherSlider.value);

      const targetMap = (tool === 'bucket-protect') ? protectMaskMap : eraseMaskMap;
      const oppositeMap = (tool === 'bucket-protect') ? eraseMaskMap : protectMaskMap;

      if (currentMode === 'flood') {
        // 連続領域バケツ (Flood Fill)
        const visited = new Uint8Array(w * h);
        const queue = new Int32Array(w * h);
        let head = 0, tail = 0;

        const firstPos = startY * w + startX;
        queue[tail++] = firstPos;
        visited[firstPos] = 1;

        while (head < tail) {
          const curr = queue[head++];
          const px = curr % w;
          const py = Math.floor(curr / w);
          const idx = curr * 4;

          const dist = Math.sqrt((src[idx] - startR)**2 + (src[idx + 1] - startG)**2 + (src[idx + 2] - startB)**2);

          if (dist <= tol + feather) {
            let maskVal = 1.0;
            if (dist > tol && feather > 0) {
              maskVal = 1.0 - ((dist - tol) / feather);
            }

            targetMap[curr] = Math.max(targetMap[curr], maskVal);
            oppositeMap[curr] = Math.max(0, oppositeMap[curr] - maskVal);

            const neighbors = [
              px > 0 ? curr - 1 : -1,
              px < w - 1 ? curr + 1 : -1,
              py > 0 ? curr - w : -1,
              py < h - 1 ? curr + w : -1
            ];

            for (let i = 0; i < 4; i++) {
              const n = neighbors[i];
              if (n !== -1 && !visited[n]) {
                visited[n] = 1;
                queue[tail++] = n;
              }
            }
          }
        }
      } else {
        // 全体同色バケツ
        for (let i = 0; i < w * h; i++) {
          const idx = i * 4;
          const dist = Math.sqrt((src[idx] - startR)**2 + (src[idx + 1] - startG)**2 + (src[idx + 2] - startB)**2);

          if (dist <= tol + feather) {
            let maskVal = 1.0;
            if (dist > tol && feather > 0) {
              maskVal = 1.0 - ((dist - tol) / feather);
            }

            targetMap[i] = Math.max(targetMap[i], maskVal);
            oppositeMap[i] = Math.max(0, oppositeMap[i] - maskVal);
          }
        }
      }
    }

    /**
     * ソフトアルファブレンドブラシの適用処理
     */
    function applyBrush(cx, cy, tool) {
      const radius = parseInt(brushSizeSlider.value, 10) / 2;
      const hardness = parseInt(brushHardnessSlider.value, 10) / 100;
      const innerRadius = radius * hardness;

      const w = canvas.width;
      const h = canvas.height;

      const minX = Math.max(0, Math.floor(cx - radius));
      const maxX = Math.min(w - 1, Math.ceil(cx + radius));
      const minY = Math.max(0, Math.floor(cy - radius));
      const maxY = Math.min(h - 1, Math.ceil(cy + radius));

      const targetMap = (tool === 'protect') ? protectMaskMap : eraseMaskMap;
      const oppositeMap = (tool === 'protect') ? eraseMaskMap : protectMaskMap;

      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          const dist = Math.hypot(x - cx, y - cy);
          if (dist <= radius) {
            let alpha = 1.0;
            if (dist > innerRadius && radius > innerRadius) {
              const t = (dist - innerRadius) / (radius - innerRadius);
              alpha = 0.5 * (1.0 + Math.cos(Math.PI * t));
            }

            const idx = y * w + x;
            targetMap[idx] = Math.max(targetMap[idx], alpha);
            oppositeMap[idx] = Math.max(0, oppositeMap[idx] - alpha);
          }
        }
      }
    }

    function drawBrushLine(x0, y0, x1, y1, tool) {
      const dist = Math.hypot(x1 - x0, y1 - y0);
      const step = 2;
      if (dist === 0) {
        applyBrush(x0, y0, tool);
        return;
      }
      for (let t = 0; t <= dist; t += step) {
        const x = Math.round(x0 + (x1 - x0) * (t / dist));
        const y = Math.round(y0 + (y1 - y0) * (t / dist));
        applyBrush(x, y, tool);
      }
    }

    // アルファチャンネル平滑化
    function smoothAlphaChannel(alphaArray, w, h, radius) {
      if (radius <= 0) return alphaArray;
      
      const r = Math.ceil(radius);
      const temp = new Float32Array(w * h);
      const out = new Float32Array(w * h);

      // 水平
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let sum = 0;
          let count = 0;
          for (let kx = -r; kx <= r; kx++) {
            const nx = x + kx;
            if (nx >= 0 && nx < w) {
              sum += alphaArray[y * w + nx];
              count++;
            }
          }
          temp[y * w + x] = sum / count;
        }
      }

      // 垂直
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) {
          let sum = 0;
          let count = 0;
          for (let ky = -r; ky <= r; ky++) {
            const ny = y + ky;
            if (ny >= 0 && ny < h) {
              sum += temp[ny * w + x];
              count++;
            }
          }
          out[y * w + x] = sum / count;
        }
      }

      return out;
    }

    // コア画像生成（透過＆スムーズアルファ合成）
    function generateProcessedImageData() {
      if (!originalData || !protectMaskMap || !eraseMaskMap) return null;

      const w = originalData.width;
      const h = originalData.height;
      const target = hexToRgb(targetColorInput.value);
      const tol = parseFloat(toleranceSlider.value);
      const feather = parseFloat(featherSlider.value);
      const smoothRadius = parseFloat(smoothSlider.value);

      const output = ctx.createImageData(w, h);
      const src = originalData.data;
      const dst = output.data;

      let alphaMap = new Float32Array(w * h);

      if (currentMode === 'flood') {
        const visited = new Uint8Array(w * h);
        const queue = new Int32Array(w * h);
        let head = 0, tail = 0;

        alphaMap.fill(1.0);

        for (let x = 0; x < w; x++) {
          queue[tail++] = x;
          visited[x] = 1;
          const bIdx = (h - 1) * w + x;
          queue[tail++] = bIdx;
          visited[bIdx] = 1;
        }
        for (let y = 1; y < h - 1; y++) {
          const lIdx = y * w;
          queue[tail++] = lIdx;
          visited[lIdx] = 1;
          const rIdx = y * w + (w - 1);
          queue[tail++] = rIdx;
          visited[rIdx] = 1;
        }

        while (head < tail) {
          const curr = queue[head++];
          const px = curr % w;
          const py = Math.floor(curr / w);
          const idx = curr * 4;

          // 手動保護マスク(1.0に近いほど)は領域透過探査をブロック
          if (protectMaskMap[curr] > 0.8) continue;

          const dist = Math.sqrt((src[idx] - target.r)**2 + (src[idx + 1] - target.g)**2 + (src[idx + 2] - target.b)**2);

          if (dist <= tol + feather) {
            if (dist <= tol) {
              alphaMap[curr] = 0;
            } else {
              alphaMap[curr] = (dist - tol) / feather;
            }

            const neighbors = [
              px > 0 ? curr - 1 : -1,
              px < w - 1 ? curr + 1 : -1,
              py > 0 ? curr - w : -1,
              py < h - 1 ? curr + w : -1
            ];

            for (let i = 0; i < 4; i++) {
              const n = neighbors[i];
              if (n !== -1 && !visited[n]) {
                visited[n] = 1;
                queue[tail++] = n;
              }
            }
          }
        }

      } else {
        for (let i = 0; i < w * h; i++) {
          const idx = i * 4;
          const dist = Math.sqrt((src[idx] - target.r)**2 + (src[idx + 1] - target.g)**2 + (src[idx + 2] - target.b)**2);
          if (dist <= tol) {
            alphaMap[i] = 0;
          } else if (dist <= tol + feather) {
            alphaMap[i] = (dist - tol) / feather;
          } else {
            alphaMap[i] = 1.0;
          }
        }
      }

      // 手動ソフト透過マスク & 手動保護マスクのアンチエイリアスブレンド
      for (let i = 0; i < w * h; i++) {
        const eraseVal = eraseMaskMap[i];    
        const protectVal = protectMaskMap[i]; 

        if (eraseVal > 0) {
          alphaMap[i] = alphaMap[i] * (1.0 - eraseVal);
        }
        if (protectVal > 0) {
          alphaMap[i] = alphaMap[i] + (1.0 - alphaMap[i]) * protectVal;
        }
      }

      // 境界ブレンド
      if (smoothRadius > 0) {
        alphaMap = smoothAlphaChannel(alphaMap, w, h, smoothRadius);
      }

      // 最終出力ピクセルデータ構築
      for (let i = 0; i < w * h; i++) {
        const idx = i * 4;
        dst[idx] = src[idx];
        dst[idx + 1] = src[idx + 1];
        dst[idx + 2] = src[idx + 2];
        dst[idx + 3] = Math.round((src[idx + 3] / 255) * alphaMap[i] * 255);
      }

      return output;
    }

    // プレビュー描画（マスクオーバーレイ表示）
    function render() {
      if (!originalData) return;
      const processed = generateProcessedImageData();
      if (!processed) return;

      ctx.putImageData(processed, 0, 0);

      if (showMaskCheckbox.checked && protectMaskMap && eraseMaskMap) {
        const pColor = hexToRgb(protectColorInput.value);
        const eColor = hexToRgb(eraseColorInput.value);
        const w = canvas.width;
        const h = canvas.height;
        
        const overlay = ctx.createImageData(w, h);
        const oData = overlay.data;

        for (let i = 0; i < w * h; i++) {
          const pVal = protectMaskMap[i];
          const eVal = eraseMaskMap[i];

          if (pVal > 0) {
            const idx = i * 4;
            oData[idx] = pColor.r;
            oData[idx + 1] = pColor.g;
            oData[idx + 2] = pColor.b;
            oData[idx + 3] = Math.round(pVal * 120);
          } else if (eVal > 0) {
            const idx = i * 4;
            oData[idx] = eColor.r;
            oData[idx + 1] = eColor.g;
            oData[idx + 2] = eColor.b;
            oData[idx + 3] = Math.round(eVal * 120);
          }
        }

        const tempC = document.createElement('canvas');
        tempC.width = w;
        tempC.height = h;
        tempC.getContext('2d').putImageData(overlay, 0, 0);
        ctx.drawImage(tempC, 0, 0);
      }
    }

    // 保存処理
    downloadPngBtn.addEventListener('click', () => {
      exportImage('image/png', 'transparent_image.png');
    });

    downloadWebpBtn.addEventListener('click', () => {
      exportImage('image/webp', 'transparent_image.webp');
    });

    function exportImage(mimeType, filename) {
      if (!originalImage) return;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');

      const cleanData = generateProcessedImageData();
      exportCtx.putImageData(cleanData, 0, 0);

      const link = document.createElement('a');
      link.download = filename;
      link.href = exportCanvas.toDataURL(mimeType, 1.0);
      link.click();
    }

    // Helpers
    function hexToRgb(hex) {
      const bigint = parseInt(hex.slice(1), 16);
      return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    // メモリ保存・読み出しイベント
    document.getElementById('saveMemoryBtn').addEventListener('click', async () => {
      if (!originalImage) {
        AppMemory.showToast('保存する画像データがありません', 'warning');
        return;
      }
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');
      const cleanData = generateProcessedImageData();
      exportCtx.putImageData(cleanData, 0, 0);

      await AppMemory.save(exportCanvas, { filename: 'transparent_image.png' });
    });

    document.getElementById('loadMemoryBtn').addEventListener('click', async () => {
      if (!(await AppMemory.hasData())) {
        AppMemory.showToast('メモリに保存された画像データがありません', 'warning');
        return;
      }

      if (originalImage) {
        if (!confirm('既存のデータが消えてしまいますが、よろしいですか？')) {
          return;
        }
      }

      const file = await AppMemory.loadAsFile('memory_transparent_image.png');
      if (file) {
        loadImage(file);
        AppMemory.showToast('メモリから画像を読み出しました', 'info');
      }
    });
  </script>
</body>
</html>
